<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fakepormance - Application Status</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    width: 92%;
    max-width: 390px;
    background: white;
    border-radius: 25px;
    padding: 35px 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    text-align: center;
}

/* Logo Image */
.logo-img {
    width: 140px;
    margin-bottom: 20px;
}

.subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 25px;
}

h2 {
    font-size: 18px;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 15px;
    border: 1px solid #ddd;
    font-size: 14px;
    margin-bottom: 18px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 15px;
    border: none;
    background: linear-gradient(135deg, #e6007e, #ff4da6);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.03);
}
</style>
</head>

<body>

<div class="card">
    <img src="fakepormance.png" class="logo-img" alt="Fakepormance Logo">
    <div class="subtitle">Careers Application Portal</div>

    <h2>Check Your Application</h2>
    <input type="text" placeholder="Enter Application ID">
    <button onclick="redirect()">View Application Status</button>
</div>

<script>
function redirect(){
    window.location.href = "valentine.html";
}
</script>

</body>
</html>
